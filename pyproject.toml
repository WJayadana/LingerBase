[project]
name = "manga-translator-cli"
version = "0.1.0"
description = "Modular CLI pipeline for translating manga/manhwa/manhua from image collections."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pillow>=10.3.0",
    "opencv-python>=4.9.0",
    "pymupdf>=1.24.0",
]

[project.scripts]
manga = "manga_cli.cli:app"

[dependency-groups]
dev = [
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["manga_cli"]
